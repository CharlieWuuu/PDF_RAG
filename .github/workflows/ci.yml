name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API 測試與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # 單元測試只涵蓋純函式，不需要資料庫或 API 金鑰
      - run: npm test
        working-directory: api
      - run: npm run build
        working-directory: api

  web:
    name: 前端建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    name: 建置 Docker 映像檔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只驗證映像檔建得起來，不推送到 registry
      - run: docker build -t pdf-rag-api ./api
