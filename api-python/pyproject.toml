[project]
name = "pdf-rag-api-python"
version = "0.1.0"
description = "PDF RAG API 的 Python 實作，與 NestJS 版功能對等"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",   # FastAPI 接收檔案上傳所需
    "pymupdf>=1.25",
    "psycopg[binary,pool]>=3.2",
    "google-genai>=1.0",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
